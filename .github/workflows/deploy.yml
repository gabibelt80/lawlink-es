name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, lawlink]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply DB changes
        run: npx prisma db push --skip-generate

      - name: Build and restart
        run: |
          pm2 stop lawlink
          rm -rf .next-build
          NEXT_DIST_DIR=.next-build npx next build
          pm2 start lawlink

      - name: Health check
        run: sleep 3 && curl -s http://localhost:3000/api/health