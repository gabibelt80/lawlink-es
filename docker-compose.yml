services:
  db:
    image: mariadb:12.3
    container_name: juridictas-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-juridictas_root}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-juridictas}
      MARIADB_USER: ${MARIADB_USER:-juridictas}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-juridictas}
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mariadb-init:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=1000
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 仅在 docker compose up app 时启动；本地开发用 npm run dev 就跳过 app
  app:
    build: .
    container_name: juridictas-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${MARIADB_USER:-juridictas}:${MARIADB_PASSWORD:-juridictas}@db:3306/${MARIADB_DATABASE:-juridictas}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY}
      APP_STORAGE_DIR: /app/storage
    ports:
      - "3000:3000"
    volumes:
      - app_storage:/app/storage
    profiles:
      - full

volumes:
  mariadb_data:
  app_storage: